<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Japan Map - Locations from Notion</title>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.css" rel="stylesheet" />
  </head>
  <body>
    <div id="loading" class="loading">
      <div class="loading-container">
        <div class="loading-text">Loading your Japan map</div>
        <div class="loading-bar">
          <div class="loading-bar-fill"></div>
        </div>
      </div>
    </div>
    <div id="map"></div>

    <!-- Floating navigation menu -->
    <div class="floating-nav-container">
      <nav class="floating-nav">
        <button class="nav-button" id="nav-categories" title="Categories">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"/>
            <rect x="14" y="3" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/>
            <rect x="3" y="14" width="7" height="7"/>
          </svg>
          <span>Categories</span>
        </button>
        <button class="nav-button" id="nav-search" title="Search">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <path d="M21 21l-4.35-4.35"/>
          </svg>
          <span>Search</span>
        </button>
      </nav>
      <div id="nav-panel-container"></div>
    </div>

    <!-- Bottom card for location details -->
    <div id="location-card" class="location-card">
      <div class="card-handle"></div>
      <div class="card-content">
        <h3 id="card-title"></h3>
        <div id="card-chips"></div>
        <div id="card-photos" class="card-photos"></div>
        <p id="card-address"></p>
        <p id="card-description"></p>
        <p id="card-coordinates"></p>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
