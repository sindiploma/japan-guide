services:
  # Backend API Server
  - type: web
    name: japan-map-api
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: VITE_MAPBOX_TOKEN
        sync: false
      - key: VITE_NOTION_API_KEY
        sync: false
      - key: VITE_NOTION_DATABASE_ID
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: PORT
        value: 10000
    healthCheckPath: /api/locations

  # Frontend Static Site
  - type: web
    name: japan-map-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_MAPBOX_TOKEN
        sync: false
      - key: VITE_API_URL
        value: https://japan-map-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
